name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Shell script syntax
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n packaging/build-deb.sh
          bash -n packaging/umbra-nm-dispatcher

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel -o dist
      - name: Install the wheel in a clean venv and run it
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/umbra-*.whl
          # profiles/schema must ship with the wheel, so these work with no repo:
          cd /tmp
          /tmp/venv/bin/umbra --version
          /tmp/venv/bin/umbra list | grep -qx home
          /tmp/venv/bin/umbra plan home >/dev/null

  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the .deb
        run: |
          bash packaging/build-deb.sh
          test -f dist/umbra_*.deb
          dpkg-deb --info dist/umbra_*.deb
          # sanity: the package declares its dependencies and ships the policy
          dpkg-deb --info dist/umbra_*.deb | grep -q "Depends:"
          dpkg-deb --contents dist/umbra_*.deb | grep -q "usr/share/polkit-1/actions/com.forrestlasiter.umbra.policy"
          dpkg-deb --contents dist/umbra_*.deb | grep -q "etc/NetworkManager/dispatcher.d/50-umbra"

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the polkit policy XML
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libxml2-utils
          xmllint --noout packaging/com.forrestlasiter.umbra.policy
          grep -q "com.forrestlasiter.umbra.run" packaging/com.forrestlasiter.umbra.policy

  ios-core:
    # The iOS core is a pure Swift package (Foundation only, no Network Extension),
    # so `swift test` compiles it and runs the shared datapath tests -- the same
    # DNS-sinkhole / WireGuard-config logic the app ships. Turns the Swift port
    # from "device-test pending" into CI-verified.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: swift test (UmbraCore)
        working-directory: ios/UmbraCore
        run: swift test

  ios-app:
    # Compile the full iOS app + Packet Tunnel extension (ContentView, the
    # provider, UDPForwarder) -- the pieces swift test can't reach. Generates the
    # Xcode project with XcodeGen and builds for the simulator, no signing.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build (no signing)
        working-directory: ios
        run: |
          xcodebuild build \
            -project Umbra.xcodeproj \
            -scheme Umbra \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

  android:
    # `:app:testDebugUnitTest` compiles ALL the app's Kotlin (main + test) and runs
    # the pure-JVM tests (posture engine, DNS datapath, WireGuard config, tunnel
    # mode). A green run means the whole Android app compiles -- the native tunnel
    # bring-up still needs a device, but nothing else is unverified.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unit tests
        working-directory: android
        # ubuntu-latest ships the Android SDK preinstalled (licenses accepted);
        # AGP finds it via ANDROID_SDK_ROOT and downloads any missing components.
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
