apiVersion: umbra/v1
kind: Profile
name: travel
description: >
  Hostile-network mode. Assume the LAN and ISP are adversarial: MAC randomized,
  all local discovery silenced, Bluetooth off, all traffic forced through the
  tunnel with a killswitch, egress restricted to an allowlist.
extends: home
meta:
  fail_mode: closed
  require_confirm: false
modules:
  rf:
    enabled: true
    mac_randomization: per-network
    suppress_probe_requests: true
    bluetooth: off
    radios: [wifi]
  netdark:
    enabled: true
    inbound_policy: drop
    block_listening_services: true
  tunnel:
    enabled: true
    mode: wireguard
    profile_ref: wg-hub
    killswitch: true
    dns: tunnel
    leak_guard: [dns, ipv6, webrtc]
  telemetry:
    enabled: true
    egress: allowlist
