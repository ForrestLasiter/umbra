apiVersion: umbra/v1
kind: Profile
name: normal
description: >
  Baseline. Every control off / asserting nothing. Applying this profile is the
  supported way to "return the machine to stock" — it restores the snapshots of
  whatever the previously active profile changed.
meta:
  fail_mode: open
  require_confirm: false
modules:
  rf:
    enabled: false
  netdark:
    enabled: false
  tunnel:
    enabled: false
  telemetry:
    enabled: false
