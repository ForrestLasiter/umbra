apiVersion: umbra/v1
kind: Profile
name: travel
description: >
  Hostile-network mode. Assume the LAN and ISP are adversarial: MAC randomized,
  all local discovery silenced, Bluetooth off, all traffic forced through the
  tunnel with a killswitch, and known telemetry sinkholed.
extends: home
meta:
  fail_mode: closed
  require_confirm: false
  requires: [firewall, ipv6_privacy, discovery, telemetry, kernel, hostname, mac,
             bluetooth_off, wireguard]
modules:
  rf:
    enabled: true
    mac_randomization: per-network
    suppress_probe_requests: true
    bluetooth: "off"      # quoted: bare off/on are YAML booleans
    radios: [wifi]
  netdark:
    enabled: true
    inbound_policy: drop
    block_listening_services: true
  tunnel:
    enabled: true
    mode: wireguard
    # Any WireGuard endpoint YOU supply: drop its config at /etc/wireguard/vpn.conf
    # (a commercial VPN, a VPS you control). Umbra never assumes a home server.
    # For maximum anonymity with no fixed endpoint at all, use the paranoid
    # profile (mode: tor).
    profile_ref: vpn
    killswitch: true
    dns: tunnel
    leak_guard: [dns, ipv6]
  telemetry:
    enabled: true
    egress: blocklist
